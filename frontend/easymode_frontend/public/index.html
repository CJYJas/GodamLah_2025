<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Hackathon project for accessibility and easy mode mobile app."
    />
    <title>Easy Mode Medical App</title>

    <style>
      body {
        font-family: sans-serif;
        background-color: #f0f0f0; /* Light background for high contrast */
        margin: 0;
      }
      /* Define a simple blinking animation for the flow */
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
      .easy-mode-theme {
        font-size: 24px; /* Larger base font for easy mode */
      }
      .easy-mode-theme button {
        padding: 15px 30px;
        border-radius: 8px;
      }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root"></div>
</body>
</html>
